name: CI/CD - ChaosPlanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  app-tests:
    name: Application Tests (Frontend & Backend)
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Path Filtering
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infraestrutura/**'
              - '.github/workflows/ci.yml'

      # Backend Tests
      - name: Set up Python
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python dependencies
        if: steps.filter.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest
        if: steps.filter.outputs.backend == 'true'
        env:
          PYTHONPATH: backend
        run: |
          pytest

      # Frontend Tests
      - name: Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Run Frontend Build
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm run build

  terraform-plan:
    name: Terraform Plan
    needs: app-tests
    if: needs.app-tests.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: ./infraestrutura

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infraestrutura/tfplan

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
    outputs:
      instance_public_ip: ${{ steps.get-ip.outputs.instance_public_ip }}
    defaults:
      run:
        working-directory: ./infraestrutura

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infraestrutura

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          echo "instance_public_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

  deploy-app:
    name: Deploy Application to EC2
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform-apply.outputs.instance_public_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "/home/ubuntu/ChaosPlanning" ]; then
              git clone https://github.com/matheuzfz/ChaosPlanning.git /home/ubuntu/ChaosPlanning
            fi
            cd /home/ubuntu/ChaosPlanning
            git pull
            sudo docker-compose up --build -d
